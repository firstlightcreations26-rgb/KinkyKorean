<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Access | The Kinky Korean</title>
<style>
body{margin:0;min-height:100vh;background:#f4bfd3;color:#2a1721;font-family:Georgia,serif;display:grid;place-items:center;padding:22px}
.card{width:min(520px,100%);background:#fffaf5;padding:34px 26px;border-radius:12px;box-shadow:0 18px 45px #7d456044;text-align:center}
h1{color:#bd3c73;font-family:"Bradley Hand","Segoe Print",cursive;font-size:2.5rem;margin:.2em 0}
input,button{width:100%;padding:13px;margin-top:12px;font:inherit;box-sizing:border-box}
input{border:1px solid #d6a9b9;background:white}
button{border:0;background:#bd3c73;color:white;font-weight:bold;cursor:pointer}
.small{font-size:.9rem;line-height:1.5}.status{margin-top:15px;font-weight:bold}.hidden{display:none}
a{color:#a62f64}
</style>
</head><body>
<main class="card">
<div>🔒 💋 🔒</div>
<h1>KK's Private Pages</h1>
<p>Enter the email connected to your approved access. We'll send you a private sign-in link.</p>
<form id="loginForm">
<input id="email" type="email" required autocomplete="email" placeholder="your email">
<button type="submit">Send My Private Link 💌</button>
</form>
<p id="status" class="status"></p>
<div id="member" class="hidden">
<h2>Welcome back, Big Nuts. 💋</h2>
<p id="accessText"></p>
<div id="accessLinks"></div>
<button id="logout" type="button">Lock My Diary</button>
</div>
<p class="small">Access only works for approved, unexpired memberships. Need help? <a href="mailto:info@kinkykorean.blog">info@kinkykorean.blog</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient('https://zeeghkticnftmzslbzrc.supabase.co','sb_publishable_c1bDYHzjRzuVrW9DePRo2A_Tn4i5lOO');
const form=document.getElementById('loginForm'),statusEl=document.getElementById('status'),member=document.getElementById('member');
async function checkAccess(){
 const {data:{session}}=await client.auth.getSession();
 if(!session)return;
 const now=new Date().toISOString();
 const {data,error}=await client.from('member_access')
   .select('access_level,entry_slug,starts_at,expires_at,active')
   .eq('email',session.user.email.toLowerCase()).eq('active',true)
   .lte('starts_at',now).gt('expires_at',now)
   .order('expires_at',{ascending:false});
 if(error){statusEl.textContent='Could not check your access. Please try again.';return}
 if(!data?.length){statusEl.textContent='This diary key is locked or expired. If you paid, reply to your confirmation email. 🔒';return}
 form.classList.add('hidden');member.classList.remove('hidden');statusEl.textContent='';
 const links=document.getElementById('accessLinks');links.replaceChildren();
 document.getElementById('accessText').textContent='You have '+data.length+' active diary key'+(data.length===1?'':'s')+'.';
 for(const grant of data){
   const p=document.createElement('p'),a=document.createElement('a');
   if(grant.access_level==='single_entry'){
     a.href='private-entry.html?entry='+encodeURIComponent(grant.entry_slug);
     a.textContent='Open Entry #'+grant.entry_slug+' →';
   } else {
     a.href='private-diary.html';
     a.textContent='Open '+(grant.access_level==='unfiltered'?'Unfiltered':'Daily')+' diary →';
   }
   p.append(a,document.createTextNode(' · through '+new Date(grant.expires_at).toLocaleDateString()));
   links.append(p);
 }
}
form.addEventListener('submit',async e=>{
 e.preventDefault();statusEl.textContent='Sending your private link…';
 const email=document.getElementById('email').value.trim();
 const {error}=await client.auth.signInWithOtp({
   email,
   options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/member-login.html'}
 });
 statusEl.textContent=error?'Could not send the link. Please try again or contact KK.':'Check your email for your private sign-in link. 💌';
});
document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});
client.auth.onAuthStateChange(()=>setTimeout(checkAccess,0));checkAccess();
</script>
</body></html>
